<th:block th:fragment="substitutesDesktopTable" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<th:block th:if="${@OS2VikarConfiguration.ui.splitSubstitutesByOrgUnits}">
		<h3>Vikarer i mine enheder</h3>
	</th:block>
	<table class="table" id="desktopSubstitutes">
		<thead>
			<tr>
				<th>Navn</th>
				<th>Brugernavn</th>
				<th>Arbejdssteder</th>
				<th>Vikarbureau</th>
				<th class="actionColumn">Handlinger</th>
			</tr>
		</thead>
	</table>

	<th:block th:if="${@OS2VikarConfiguration.ui.splitSubstitutesByOrgUnits}">
		<h3>Andre vikarer</h3>
		<table class="table" id="desktopSubstitutesRest">
			<thead>
				<tr>
					<th>Navn</th>
					<th>Brugernavn</th>
					<th>Arbejdssteder</th>
					<th>Vikarbureau</th>
					<th class="actionColumn">Handlinger</th>
				</tr>
			</thead>
		</table>
	</th:block>
</th:block>

<th:block th:fragment="substitutesDesktopTableScript" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<script th:inline="javascript">
		/*<![CDATA[*/

		/*[+
			var showAgency = [[${@OS2VikarConfiguration.ui.showAgencyOnSubstitute}]];
			const splitSubstitutesByOrgUnits = [[${@OS2VikarConfiguration.ui.splitSubstitutesByOrgUnits}]];
		+]*/


		var desktopFragmentService;
		$(document).ready(function() {
			desktopFragmentService = new DesktopFragmentService();
		});

		function DesktopFragmentService() {
			this.buildTableOptions = function(ajaxUrl) {
				return {
					"destroy": true,
					"ajax": {
						"contentType": "application/json",
						"url": ajaxUrl,
						"type": "POST",
						"headers": {
							"X-CSRF-TOKEN": token
						},
						"data": function(d) {
							return JSON.stringify(d);
						}
					},
					"serverSide": true,
					"columns": [
						{
							"data": "name",
							"render": function (data, type, row, meta) {
								return data + " " + row.surname;
							}
						},
						{
							"data": "username",
							"render": function (data, type, row, meta) {
								return row.userName;
							}
						},
						{
							"data": "id",
							"orderable": false,
							"searchable": false,
							"render": function (data, type, row, meta) {
								return row.workplaceString;
							}
						},
						{
							"data": "agency",
							"visible": showAgency,
							"render": function (data, type, row, meta) {
								if (data == null) {
									return "";
								} else {
									return data;
								}
							}
						},
						{
							"data": "id",
							"orderable": false,
							"render": function (data, type, row, meta) {
								return '<a href="/substituteadmin/substitutes/' + data + '/edit"><em class="fa fa-fw fa-pencil" style="color: black;"></em></a>';
							}
						}
					],
					"pageLength" : 50,
					"responsive" : true,
					"autoWidth" : false,
					"language" : {
						"search" : "Søg",
						"lengthMenu" : "_MENU_ vikarer per side",
						"info" : "Viser _START_ til _END_ af _TOTAL_ vikarer",
						"zeroRecords" : "Ingen data...",
						"infoEmpty" : "",
						"infoFiltered" : "(ud af _MAX_ vikarer)",
						"paginate" : {
							"previous" : "Forrige",
							"next" : "Næste"
						}
					}
				};
			}

			this.init = function() {
				const mineSuffix = splitSubstitutesByOrgUnits ? "/mine" : "";
				$('#desktopSubstitutes').DataTable(this.buildTableOptions("/rest/substituteadmin/substitutes/list/desktop" + mineSuffix));

				if (splitSubstitutesByOrgUnits) {
					$('#desktopSubstitutesRest').DataTable(this.buildTableOptions("/rest/substituteadmin/substitutes/list/desktop/rest"));
				}
			}
		}
		/*]]>*/
	</script>
</th:block>
