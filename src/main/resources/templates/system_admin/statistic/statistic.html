<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4">
<head th:replace="~{fragments/header :: header(select2 = true, datepicker = true)}"></head>
<body class="top-navigation">
<div id="wrapper">
    <div id="page-wrapper" class="gray-bg">
        <div th:replace="~{fragments/topbar :: topbar(page = 'statistic')}"></div>

        <div class="wrapper wrapper-content">
            <div class="row">
                <div class="col-lg-12">
                    <div class="ibox">
                        <div class="ibox-title">
                            <h2><em class="fa fa-bar-chart"></em> &nbsp; Statistik</h2>

                            <div class="ibox-tools" sec:authorize="hasRole('ROLE_SYSTEM_ADMIN')">
                                <div id="download-statistic" class="btn btn-primary">Download vikarstatistik</div>
                            </div>
                        </div>

                        <div class="ibox-content">
                            <th:block th:replace="~{system_admin/statistic/fragment/view :: statisticView}"></th:block>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: scripts(select2 = true, datepicker = true)}"></div>

<script th:src="@{/vendor/chartjs/chart.min.js}" defer></script>
<script th:src="@{/vendor/date-fns/date-fns.min.js}" defer></script>
<script th:src="@{/vendor/date-fns/locale-da.min.js}" defer></script>
<script type="module" th:src="@{/js/statistic/statistic.js}"></script>

<script th:inline="javascript">
    /*<![CDATA[*/

        var url = [[@{/systemadmin}]];
        var baseUrl = [[@{/}]];
    +]*/
    /*]]>*/
</script>
</body>
</html>
