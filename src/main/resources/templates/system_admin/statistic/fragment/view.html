<!DOCTYPE html>
<html lang="en">
<body>
<th:block th:fragment="statisticView">
    <div>
        <div class="d-flex justify-content-between" id="filter-container">
            <th:block th:replace="~{system_admin/statistic/fragment/filter-options :: filter-options}"></th:block>
            <div style="font-weight: bold; font-size: large;">
                <label>Total over periode:</label>
                <span id="stat-summed-total">0</span>
            </div>

            <div style="display: none;">
                <button class="btn btn-outline-primary btn-lg generateChartButton">Vis graf</button>
            </div>
        </div>

        <div class="chart-grid">

            <div th:each="chart, it : ${availableCharts}"
                 th:attr="data-config-id=${chart.configId}, data-field-name=${chart.fieldName}, data-title=${chart.title}"
                 th:id="${'chart_' + chart.id}"
                 th:class="${'chartView chartContainer ' + (chart.type.name() == 'BAR' ? 'chart-width-full' : '')}">

                <div class="chartWrapper">
                    <canvas class="chartCanvas  "></canvas>
                </div>

            </div>
        </div>
    </div>

</th:block>
</body>
</html>
